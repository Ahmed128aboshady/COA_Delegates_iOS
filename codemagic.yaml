# Codemagic CI/CD Build Configuration for COA Delegates iOS
workflows:
  ios-build:
    name: Build COA Delegates iOS
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: '*'
          include: true
    scripts:
      - name: Initialize Xcode Project structure
        script: |
          echo "Xcode project initialization..."
      - name: Build Unsigned iOS App (.app)
        script: |
          xcodebuild \
            -project COA_Delegates_iOS.xcodeproj \
            -scheme COA_Delegates_iOS \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -configuration Release \
            -derivedDataPath build_output \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_STRICT_CONCURRENCY=minimal \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            clean build
      - name: Packaging simulator and unsigned build
        script: |
          mkdir -p build
          cp -r build_output/Build/Products/Release-iphonesimulator/COA_Delegates_iOS.app build/
    artifacts:
      - build/*.app

